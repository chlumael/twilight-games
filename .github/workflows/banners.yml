name: banners

# Weekly refresh of data/banners.json. Opens a pull request for review instead
# of committing directly, because the sources are community data.
on:
  schedule:
    - cron: "17 3 * * 3" # Wednesdays 03:17 UTC (12:17 KST)
  workflow_dispatch:

jobs:
  build:
    # Read-only: this job touches third-party data.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # 림버스 정기 업데이트 공지(그림)의 추출 기간을 읽는 글자 인식 도구
      - run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-kor
      # 명일방주 공지 배너 그림의 글자를 읽는 도구
      - run: pip install --quiet rapidocr onnxruntime
      - run: node scripts/banners/build.mjs data/banners.new.json
      - run: node scripts/banners/validate.mjs data/banners.new.json
      # 게임 이미지(캐릭터·무기 아이콘, 배너 그림)의 줄인 사본. 이미 있는 파일은 다시 받지 않는다
      - run: pip install --quiet pillow
      - run: python3 -I scripts/images/build.py --pack data/banners.new.json
      - uses: actions/upload-artifact@v4
        with:
          name: banners
          path: |
            data/banners.new.json
            data/images

  pull-request:
    needs: build
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: banners
          path: data
      - name: Keep only real changes
        run: |
          node -e '
            const fs = require("fs");
            const strip = (p) => { const j = JSON.parse(fs.readFileSync(p, "utf8")); delete j.generatedAt; return JSON.stringify(j); };
            const changed = !fs.existsSync("data/banners.json") || strip("data/banners.json") !== strip("data/banners.new.json");
            if (changed) fs.renameSync("data/banners.new.json", "data/banners.json"); else fs.rmSync("data/banners.new.json");
            console.log(changed ? "changed" : "no change");
          '
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/banners
          commit-message: "Update banner data pack"
          title: "배너 데이터 팩 갱신"
          body: |
            자동 생성된 배너 데이터 팩 변경입니다. 진행 중인 배너와 픽업 이름이 맞는지 확인 후 합쳐주세요.
          add-paths: |
            data/banners.json
            data/images
