name: android-release

# Publishes the signed APK as a GitHub Release whenever the app version in
# android/app/build.gradle.kts has no release yet. The workflow creates the
# tag v<versionName> itself (the dev session cannot push tags).
# Release notes come from android/RELEASE_NOTES.md (Korean, shown in the app).
on:
  push:
    branches: [main, "phase*"]
    paths: ["android/app/build.gradle.kts", "android/RELEASE_NOTES.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Every release must be signed by this certificate, or installed apps cannot update.
      EXPECTED_CERT_SHA256: 21724c02904a68f70e6fa90d05e9aa03c0978cff848551f080bfe86b4389f0dc
    steps:
      - uses: actions/checkout@v4
      - name: Version not released yet?
        id: ver
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          echo "TAG=v$v" >> "$GITHUB_ENV"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$v is already released; nothing to do"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ver.outputs.skip != 'true'
        name: Signing key present
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ] || { echo "::error::Add ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - if: steps.ver.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.ver.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - if: steps.ver.outputs.skip != 'true'
        run: npm ci
      - if: steps.ver.outputs.skip != 'true'
        run: npm test
      - if: steps.ver.outputs.skip != 'true'
        run: npm run build:android
      - if: steps.ver.outputs.skip != 'true'
        name: Build APK
        working-directory: android
        env:
          TWILIGHT_KEYSTORE: ${{ runner.temp }}/release.jks
          TWILIGHT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - if: steps.ver.outputs.skip != 'true'
        name: Verify signing certificate
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          sha=$("$bt/apksigner" verify --print-certs "$apk" | grep -oP 'SHA-256 digest: \K[0-9a-f]+' | head -1)
          [ "$sha" = "$EXPECTED_CERT_SHA256" ] || { echo "::error::wrong signing key ($sha)"; exit 1; }
          cp "$apk" "twilight-games-${TAG#v}.apk"
      - if: steps.ver.outputs.skip != 'true'
        name: Release notes
        run: |
          cp android/RELEASE_NOTES.md notes.md 2>/dev/null || true
          [ -s notes.md ] || echo "개선 사항이 있습니다." > notes.md
      - if: steps.ver.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: 황혼 게임즈 ${{ env.TAG }}
          body_path: notes.md
          files: twilight-games-*.apk
