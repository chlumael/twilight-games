name: build

on:
  push:
    branches: [main, "phase*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write # 릴리스에 설치 파일 올리기
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
      - uses: actions/upload-artifact@v4
        with:
          name: twilight-games-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      # PC 설치 파일을 최신 릴리스에 올린다 (받는 주소가 항상 같도록 파일 이름을 고정).
      # 릴리스는 android-release가 만든다. 아직 없으면 잠시 기다린다.
      - name: PC 설치 파일을 릴리스에 올리기
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          cp src-tauri/target/release/bundle/nsis/*.exe twilight-games-pc-setup.exe
          for i in $(seq 1 20); do
            gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            sleep 30
          done
          gh release upload "v$v" twilight-games-pc-setup.exe --clobber --repo "$GITHUB_REPOSITORY"
