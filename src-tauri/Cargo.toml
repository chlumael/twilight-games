[package]
name = "twilight-games"
version = "0.9.15"
description = "황혼 게임즈 - 가챠 오버레이 트래커"
edition = "2021"

[lib]
name = "twilight_games_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
# 화면 읽기: 화면 찍기(GDI)와 윈도우 내장 글자 인식(WinRT)
windows = { version = "0.61", features = [
  "Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams",
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging",
  # 원신 기원 기록 불러오기(윈도우 내장 인터넷 연결)
  "Web", "Web_Http",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
